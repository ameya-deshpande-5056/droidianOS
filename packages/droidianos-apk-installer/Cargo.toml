[package]
name = "droidianos-apk-installer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
droidianos-dbus-lite = { path = "../../shared/rust-libs/droidianos-dbus-lite" }

[lib]
name = "droidianos_apk"
path = "src/lib.rs"

[[bin]]
name = "droidianos-apk-inspect"
path = "src/main.rs"

[[bin]]
name = "droidianos-apk-installerd"
path = "src/service.rs"

[[bin]]
name = "droidianos-apk-installer"
path = "src/ui.rs"
