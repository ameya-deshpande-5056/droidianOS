name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container: &debian_container
      image: debian:stable
      options: --privileged

    steps:
      - &install_checkout_prerequisites
        name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates git

      - &checkout
        uses: actions/checkout@v4

      - name: Install package build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cargo \
            debhelper \
            devscripts \
            dpkg-dev \
            fonts-dejavu-core \
            libdbus-1-dev \
            librsvg2-bin \
            rustc

      - name: Build packages
        run: sh ./build/scripts/build-packages.sh

      - name: Upload package artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: droidianOS-packages
          path: build/artifacts/packages/
          if-no-files-found: error
          retention-days: 14

  build-local-repo:
    if: github.event_name != 'pull_request'
    needs: build-packages
    runs-on: ubuntu-latest
    container: *debian_container

    steps:
      - *install_checkout_prerequisites

      - *checkout

      - name: Install local repository dependencies
        run: |
          apt-get update
          apt-get install -y apt-utils dpkg-dev gnupg

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidianOS-packages
          path: build/artifacts/packages

      - name: Import release signing key
        env:
          DROIDIANOS_GPG_PRIVATE_KEY: ${{ secrets.DROIDIANOS_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${DROIDIANOS_GPG_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$DROIDIANOS_GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Build local APT repository
        env:
          DROIDIANOS_GPG_KEY: ${{ secrets.DROIDIANOS_GPG_KEY }}
          DROIDIANOS_GPG_PASSPHRASE: ${{ secrets.DROIDIANOS_GPG_PASSPHRASE }}
        run: sh ./build/scripts/build-local-repo.sh

      - name: Upload local repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidianOS-repo
          path: build/artifacts/repo/
          if-no-files-found: error
          retention-days: 14

  build-iso:
    if: github.event_name != 'pull_request'
    needs: build-local-repo
    runs-on: ubuntu-latest
    container: *debian_container

    steps:
      - *install_checkout_prerequisites

      - *checkout

      - name: Install ISO build dependencies
        run: |
          apt-get update
          apt-get install -y \
            apt-utils \
            curl \
            gnupg \
            isolinux \
            jq \
            live-build \
            squashfs-tools \
            syslinux-common \
            unzip \
            xorriso

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidianOS-packages
          path: build/artifacts/packages

      - name: Download local repository artifact
        uses: actions/download-artifact@v4
        with:
          name: droidianOS-repo
          path: build/artifacts/repo

      - name: Configure Waydroid APT archive
        run: |
          . /etc/os-release
          DEBIAN_CODENAME="${VERSION_CODENAME:-}"
          if [ -z "$DEBIAN_CODENAME" ]; then
            echo "Unable to determine the current Debian Stable codename." >&2
            exit 1
          fi

          WAYDROID_REPO="https://repo.waydro.id"
          if ! curl --fail --silent --show-error --location --output /dev/null "$WAYDROID_REPO/dists/$DEBIAN_CODENAME/Release"; then
            echo "Waydroid does not provide an APT archive for Debian $DEBIAN_CODENAME." >&2
            exit 1
          fi

          mkdir -p build/live-build/config/archives
          printf 'deb %s/ %s main\n' "$WAYDROID_REPO" "$DEBIAN_CODENAME" > build/live-build/config/archives/waydroid.list.chroot
          cp build/live-build/config/archives/waydroid.list.chroot build/live-build/config/archives/waydroid.list.binary

          KEY_DIR="$(mktemp -d)"
          chmod 700 "$KEY_DIR"
          curl --fail --silent --show-error --location "$WAYDROID_REPO/waydroid.gpg" --output "$KEY_DIR/waydroid.gpg"
          gpg --batch --quiet --homedir "$KEY_DIR" --import "$KEY_DIR/waydroid.gpg"
          gpg --batch --quiet --homedir "$KEY_DIR" --armor --export > build/live-build/config/archives/waydroid.key.chroot
          rm -rf "$KEY_DIR"
          cp build/live-build/config/archives/waydroid.key.chroot build/live-build/config/archives/waydroid.key.binary

      - name: Build ISO
        run: sh ./build/scripts/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidianOS-iso
          path: build/artifacts/iso/
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    if: github.event_name != 'pull_request'
    needs: build-iso
    runs-on: ubuntu-latest
    container: *debian_container

    steps:
      - *install_checkout_prerequisites

      - *checkout

      - name: Install release artifact dependencies
        run: |
          apt-get update
          apt-get install -y gnupg

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: droidianOS-iso
          path: build/artifacts/iso

      - name: Import release signing key
        env:
          DROIDIANOS_GPG_PRIVATE_KEY: ${{ secrets.DROIDIANOS_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${DROIDIANOS_GPG_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$DROIDIANOS_GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Generate release artifacts
        env:
          DROIDIANOS_GPG_KEY: ${{ secrets.DROIDIANOS_GPG_KEY }}
          DROIDIANOS_GPG_PASSPHRASE: ${{ secrets.DROIDIANOS_GPG_PASSPHRASE }}
        run: sh ./build/scripts/release-artifacts.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidianOS-release
          path: build/artifacts/release/
          if-no-files-found: error
          retention-days: 14

  archive-build:
    if: github.event_name != 'pull_request'
    needs: release-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: droidianOS-iso
          path: build/artifacts/upload/iso

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidianOS-build
          path: build/artifacts/upload/
          if-no-files-found: error
          retention-days: 14

  publish-sourceforge:
    if: github.event_name != 'pull_request'
    needs: archive-build
    runs-on: ubuntu-latest

    steps:
      - name: Install SourceForge upload dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidianOS-build
          path: build/artifacts/upload

      - name: Publish SourceForge ISO
        env:
          SOURCEFORGE_UPLOAD_TARGET: ${{ secrets.SOURCEFORGE_UPLOAD_TARGET }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${SOURCEFORGE_UPLOAD_TARGET:-}" ]; then
            echo "SOURCEFORGE_UPLOAD_TARGET secret is required to publish the ISO to SourceForge." >&2
            exit 1
          fi
          if [ -z "${SOURCEFORGE_SSH_PRIVATE_KEY:-}" ]; then
            echo "SOURCEFORGE_SSH_PRIVATE_KEY secret is required to publish the ISO to SourceForge." >&2
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SOURCEFORGE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh_opts="-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o IdentitiesOnly=yes -i $HOME/.ssh/id_ed25519"

          rsync -av --delete -e "ssh $ssh_opts" build/artifacts/upload/iso/ "${SOURCEFORGE_UPLOAD_TARGET}"

  summarize-download-links:
    if: github.event_name != 'pull_request'
    needs: publish-sourceforge
    runs-on: ubuntu-latest

    steps:
      - name: Summarize download links
        env:
          SOURCEFORGE_UPLOAD_TARGET: ${{ secrets.SOURCEFORGE_UPLOAD_TARGET }}
        shell: bash
        run: |
          {
            echo "## Download links"
            echo ""
            echo "- SourceForge ISO mirror: ${SOURCEFORGE_UPLOAD_TARGET:-<configure SOURCEFORGE_UPLOAD_TARGET secret>}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=ISO downloads::ISO artifacts are published to SourceForge"
