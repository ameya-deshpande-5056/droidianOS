name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  iso-build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            apt-utils \
            build-essential \
            cargo \
            debhelper \
            devscripts \
            dpkg-dev \
            gnupg \
            isolinux \
            libdbus-1-dev \
            live-build \
            rustc \
            squashfs-tools \
            syslinux-common \
            xorriso

      - name: Configure Waydroid APT archive
        if: github.event_name != 'pull_request'
        env:
          WAYDROID_APT_SOURCE: ${{ secrets.WAYDROID_APT_SOURCE }}
          WAYDROID_APT_KEY_ASC: ${{ secrets.WAYDROID_APT_KEY_ASC }}
        run: |
          if [ -z "${WAYDROID_APT_SOURCE:-}" ]; then
            echo "WAYDROID_APT_SOURCE secret is required because the ISO package list includes waydroid." >&2
            exit 1
          fi

          mkdir -p build/live-build/config/archives
          printf '%s\n' "$WAYDROID_APT_SOURCE" > build/live-build/config/archives/waydroid.list.chroot
          printf '%s\n' "$WAYDROID_APT_SOURCE" > build/live-build/config/archives/waydroid.list.binary

          if [ -n "${WAYDROID_APT_KEY_ASC:-}" ]; then
            printf '%s\n' "$WAYDROID_APT_KEY_ASC" > build/live-build/config/archives/waydroid.key.chroot
            printf '%s\n' "$WAYDROID_APT_KEY_ASC" > build/live-build/config/archives/waydroid.key.binary
          fi

      - name: Import release signing key
        if: github.event_name != 'pull_request'
        env:
          DROIDIANOS_GPG_PRIVATE_KEY: ${{ secrets.DROIDIANOS_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${DROIDIANOS_GPG_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$DROIDIANOS_GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Build packages
        run: sh ./build/scripts/build-packages.sh

      - name: Build local APT repository
        if: github.event_name != 'pull_request'
        env:
          DROIDIANOS_GPG_KEY: ${{ secrets.DROIDIANOS_GPG_KEY }}
          DROIDIANOS_GPG_PASSPHRASE: ${{ secrets.DROIDIANOS_GPG_PASSPHRASE }}
        run: sh ./build/scripts/build-local-repo.sh

      - name: Build ISO
        if: github.event_name != 'pull_request'
        run: sh ./build/scripts/build-iso.sh

      - name: Generate release artifacts
        if: github.event_name != 'pull_request'
        env:
          DROIDIANOS_GPG_KEY: ${{ secrets.DROIDIANOS_GPG_KEY }}
          DROIDIANOS_GPG_PASSPHRASE: ${{ secrets.DROIDIANOS_GPG_PASSPHRASE }}
        run: sh ./build/scripts/release-artifacts.sh

      - name: Prepare publish artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/artifacts/upload build/artifacts/ghcr-apt-repo
          cp -a build/artifacts/iso build/artifacts/upload/iso
          cp -a build/artifacts/release build/artifacts/upload/release
          cp -a build/artifacts/packages build/artifacts/upload/packages
          cp -a build/artifacts/repo build/artifacts/ghcr-apt-repo/apt-repo
          cp -a build/artifacts/packages build/artifacts/ghcr-apt-repo/deb-packages
          cat > build/artifacts/ghcr-apt-repo/Dockerfile <<EOF
          FROM scratch
          LABEL org.opencontainers.image.title="droidianOS APT repository"
          LABEL org.opencontainers.image.description="Generated droidianOS Debian package repository and .deb artifacts"
          LABEL org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}"
          COPY apt-repo /apt-repo
          COPY deb-packages /deb-packages
          EOF

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: droidianOS-build
          path: |
            build/artifacts/upload/
            build/artifacts/ghcr-apt-repo/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/artifacts/upload/release/RELEASE_NOTES.md
          files: |
            build/artifacts/upload/iso/*
            build/artifacts/upload/release/*
            build/artifacts/upload/packages/*.deb
            build/artifacts/upload/packages/*.changes
            build/artifacts/upload/packages/*.buildinfo

  publish-apt-repo-package:
    if: github.event_name != 'pull_request'
    needs: iso-build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: droidianOS-build
          path: build-artifacts

      - name: Set GHCR package name
        id: package-name
        shell: bash
        run: |
          owner_repo="${GITHUB_REPOSITORY,,}"
          owner="${owner_repo%%/*}"
          repo="${owner_repo#*/}"
          echo "image=ghcr.io/${owner}/${repo}-apt-repo" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APT repo package
        uses: docker/build-push-action@v6
        with:
          context: build-artifacts/ghcr-apt-repo
          push: true
          tags: |
            ${{ steps.package-name.outputs.image }}:${{ github.sha }}
            ${{ steps.package-name.outputs.image }}:latest
