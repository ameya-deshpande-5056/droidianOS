name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  iso-build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            apt-utils \
            build-essential \
            cargo \
            debhelper \
            devscripts \
            dpkg-dev \
            gnupg \
            isolinux \
            libdbus-1-dev \
            live-build \
            rustc \
            squashfs-tools \
            syslinux-common \
            xorriso

      - name: Configure Waydroid APT archive
        if: github.event_name != 'pull_request'
        env:
          WAYDROID_APT_SOURCE: ${{ secrets.WAYDROID_APT_SOURCE }}
          WAYDROID_APT_KEY_ASC: ${{ secrets.WAYDROID_APT_KEY_ASC }}
        run: |
          if [ -z "${WAYDROID_APT_SOURCE:-}" ]; then
            echo "WAYDROID_APT_SOURCE secret is required because the ISO package list includes waydroid." >&2
            exit 1
          fi

          mkdir -p build/live-build/config/archives
          printf '%s\n' "$WAYDROID_APT_SOURCE" > build/live-build/config/archives/waydroid.list.chroot
          printf '%s\n' "$WAYDROID_APT_SOURCE" > build/live-build/config/archives/waydroid.list.binary

          if [ -n "${WAYDROID_APT_KEY_ASC:-}" ]; then
            printf '%s\n' "$WAYDROID_APT_KEY_ASC" > build/live-build/config/archives/waydroid.key.chroot
            printf '%s\n' "$WAYDROID_APT_KEY_ASC" > build/live-build/config/archives/waydroid.key.binary
          fi

      - name: Import release signing key
        if: github.event_name != 'pull_request'
        env:
          DROIDIANOS_GPG_PRIVATE_KEY: ${{ secrets.DROIDIANOS_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${DROIDIANOS_GPG_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$DROIDIANOS_GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Build packages
        run: sh ./build/scripts/build-packages.sh

      - name: Build local APT repository
        if: github.event_name != 'pull_request'
        env:
          DROIDIANOS_GPG_KEY: ${{ secrets.DROIDIANOS_GPG_KEY }}
          DROIDIANOS_GPG_PASSPHRASE: ${{ secrets.DROIDIANOS_GPG_PASSPHRASE }}
        run: sh ./build/scripts/build-local-repo.sh

      - name: Build ISO
        if: github.event_name != 'pull_request'
        run: sh ./build/scripts/build-iso.sh

      - name: Generate release artifacts
        if: github.event_name != 'pull_request'
        env:
          DROIDIANOS_GPG_KEY: ${{ secrets.DROIDIANOS_GPG_KEY }}
          DROIDIANOS_GPG_PASSPHRASE: ${{ secrets.DROIDIANOS_GPG_PASSPHRASE }}
        run: sh ./build/scripts/release-artifacts.sh

      - name: Prepare publish artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/artifacts/upload
          cp -a build/artifacts/iso build/artifacts/upload/iso

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: droidianOS-build
          path: |
            build/artifacts/upload/
          if-no-files-found: error
          retention-days: 14

      - name: Publish SourceForge ISO
        if: github.event_name != 'pull_request'
        env:
          SOURCEFORGE_UPLOAD_TARGET: ${{ secrets.SOURCEFORGE_UPLOAD_TARGET }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${SOURCEFORGE_UPLOAD_TARGET:-}" ]; then
            echo "SOURCEFORGE_UPLOAD_TARGET secret is required to publish the ISO to SourceForge." >&2
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [ -n "${SOURCEFORGE_SSH_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$SOURCEFORGE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          fi

          ssh_opts="-o StrictHostKeyChecking=accept-new"
          if [ -f "$HOME/.ssh/id_ed25519" ]; then
            ssh_opts="$ssh_opts -i $HOME/.ssh/id_ed25519"
          fi

          rsync -av --delete -e "ssh $ssh_opts" build/artifacts/upload/iso/ "${SOURCEFORGE_UPLOAD_TARGET}"

      - name: Summarize download links
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "## Download links"
            echo ""
            echo "- SourceForge ISO mirror: ${SOURCEFORGE_UPLOAD_TARGET:-<configure SOURCEFORGE_UPLOAD_TARGET secret>}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=ISO downloads::ISO artifacts are published to SourceForge"
